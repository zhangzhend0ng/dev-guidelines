name: Validate Harnesses

on:
  pull_request:
    branches: [master, main]
    paths:
      - "common/**"
      - "cpp/**"
      - "docs/ai/**"
      - "docs/protocols/**"
      - "docs/specs/**"
      - "docs/strategy/**"
      - "packs/**"
      - "prompts/**"
      - "references/**"
      - "scripts/**"
      - "templates/**"
      - "AGENTS.md"
      - "INDEX.md"
      - "README.md"
      - "ROADMAP.md"
  schedule:
    - cron: "0 9 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Frontmatter and cross-reference checks
        run: python scripts/validate.py --json
      - name: Stale citation check (warn only)
        run: python scripts/validate.py --stale
        continue-on-error: true
      - name: Index sync check
        run: python scripts/generate_index.py --check
      - name: AI protocol smoke checks
        run: python scripts/test_ai_protocol.py
      - name: AI protocol evaluation smoke check
        run: |
          python scripts/evaluate_ai_protocol.py docs/ai/evals/weak-model/good-runs --json
          python scripts/evaluate_ai_protocol.py docs/ai/evals/weak-model/good-runs --output /tmp/ai-eval-report.md
          test -s /tmp/ai-eval-report.md
      - name: Planning and debugging protocol smoke checks
        run: python scripts/test_plan_debug_protocol.py
      - name: Harness pack smoke checks
        run: |
          python scripts/list_packs.py
          python scripts/install_pack.py cpp-testing ai-dev
          python scripts/validate.py --installed --json
          python scripts/generate_index.py --pack cpp-testing --output /tmp/cpp-testing-index.md
          test -s /tmp/cpp-testing-index.md

  dead-links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Check external links
        run: python scripts/validate.py --dead-links
